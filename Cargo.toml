[package]
name = "ble-serial"
version = "0.1.0"
edition = "2021"
description = "BLE to virtual serial port bridge — primarily for WeAct CH9143 BLE/UART/USB"

[[bin]]
name = "ble-serial"
path = "src/main.rs"

[dependencies]
btleplug   = "0.11"
tokio      = { version = "1", features = ["full"] }
clap       = { version = "4", features = ["derive"] }
uuid       = "1"
anyhow     = "1"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures    = "0.3"
inquire    = "0.7"

# In nix 0.29, the `pty` module lives inside the `term` feature;
# `unistd` (dup, ttyname) has no feature gate.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["term", "fs"] }
